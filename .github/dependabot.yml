version: 2
updates:
  # Dev dependencies only — the extension ships zero runtime dependencies, so
  # these never reach users. Minor/patch updates are grouped into one PR a week
  # to keep the review queue small enough for a single maintainer to stay on top
  # of, while major bumps arrive as individual PRs so they can be reviewed with
  # the coordinated changes they usually require (eslint 10 needs @eslint/js 10
  # AND a matching typescript-eslint, for example).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait before adopting a freshly published version. Compromised packages are
    # typically caught and yanked within days, so a cooldown converts "we were
    # the first to install the malicious release" into "we never installed it".
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      development-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Major bumps of the lint/test toolchain routinely need coordinated changes
    # across several packages, so an automated single-package major PR can only
    # ever fail `npm ci`. typescript 7 is the current example: typescript-eslint
    # caps its peer range at <6.1.0, so adopting TS 7 requires typescript-eslint
    # to widen support first. Those upgrades are deliberate maintenance work,
    # tracked as an issue instead of arriving as unmergeable noise.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait before adopting a freshly published version. Compromised packages are
    # typically caught and yanked within days, so a cooldown converts "we were
    # the first to install the malicious release" into "we never installed it".
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      workflow-actions:
        patterns: ["*"]
    labels:
      - dependencies
      - ci
