name: Signed release

on:
  release:
    types: [published]
  schedule:
    - cron: "45 18 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag
        required: true
        type: string

permissions:
  contents: write

env:
  WEB_EXT_VERSION: 10.5.0

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: amo-production
    outputs:
      skip: ${{ steps.release.outputs.skip }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$EVENT_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            TAG=$(gh api "repos/${{ github.repository }}/releases" --jq '[.[] | select(.draft)][0].tag_name // empty')
            if [ -z "$TAG" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id)
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -f draft=true >/dev/null
      - uses: actions/checkout@v7
        if: steps.release.outputs.skip != 'true'
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: steps.release.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: browser-actions/setup-firefox@v1
        if: steps.release.outputs.skip != 'true'
        with:
          firefox-version: latest
      - name: Install geckodriver
        if: steps.release.outputs.skip != 'true'
        run: |
          curl -fsSL https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz -o /tmp/geckodriver.tar.gz
          echo "0bde38707eb0a686a20c6bd50f4adcc7d60d4f73c60eb83ee9e0db8f65823e04  /tmp/geckodriver.tar.gz" | sha256sum --check
          tar -xzf /tmp/geckodriver.tar.gz -C /tmp
          sudo install -m 0755 /tmp/geckodriver /usr/local/bin/geckodriver
      - run: npm ci --ignore-scripts
        if: steps.release.outputs.skip != 'true'
      - name: Verify version and source
        if: steps.release.outputs.skip != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$TAG" = "v$VERSION"
          test "$VERSION" = "$(node -p "require('./src/manifest.json').version")"
          npm audit --audit-level=high
          npm run secrets:audit -- --history
          npm run check
          npm run coverage
          npm run test:e2e:prepare
          FIREFOX_BIN="$(command -v firefox)" npm run test:e2e
          rm -f artifacts/ephemeral-test-*.zip
          npm run package
          npm run package:source
      - name: Submit for unlisted Mozilla signing
        if: steps.release.outputs.skip != 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p signed
          npm exec --yes --package="web-ext@$WEB_EXT_VERSION" -- web-ext sign \
            --source-dir build \
            --artifacts-dir signed \
            --channel unlisted \
            --amo-metadata amo-metadata.json \
            --upload-source-code "artifacts/ephemeral-$VERSION-source.zip" \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --approval-timeout 900000
          XPI=$(find signed -maxdepth 1 -name '*.xpi' -print -quit)
          test -n "$XPI"
          cp "$XPI" "artifacts/ephemeral-$VERSION-signed.xpi"
          unzip -p "artifacts/ephemeral-$VERSION-signed.xpi" manifest.json | jq -e --arg version "$VERSION" '.version == $version and .browser_specific_settings.gecko.id == "ephemeral@mheci.github.io"' >/dev/null
          (cd artifacts && sha256sum "ephemeral-$VERSION-signed.xpi" "ephemeral-$VERSION.zip" "ephemeral-$VERSION-source.zip" > SHA256SUMS)
      - name: Publish verified assets
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          gh release upload "$TAG" artifacts/* --clobber
          gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -f draft=false -f prerelease=false -f make_latest=true >/dev/null

  update-channel:
    # Self-hosted auto-update channel: Ephemeral is unlisted on AMO, so Firefox
    # only offers updates through the gecko.update_url manifest published to
    # GitHub Pages. Regenerated from the live release list so it can never
    # point at a download that does not exist.
    name: Publish Firefox update manifest
    needs: sign
    if: ${{ needs.sign.outputs.skip != 'true' && startsWith(needs.sign.outputs.tag, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Regenerate updates.json from published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/update-manifest.mjs --out "$RUNNER_TEMP/updates.json"
          UPDATES="$RUNNER_TEMP/updates.json" node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("src/manifest.json", "utf8"));
            const u = JSON.parse(fs.readFileSync(process.env.UPDATES, "utf8"));
            const gecko = m.browser_specific_settings?.gecko ?? {};
            if (u.id !== gecko.id) throw new Error(`id mismatch: ${u.id} vs ${gecko.id}`);
            if (!Array.isArray(u.versions) || u.versions.length === 0) throw new Error("no versions");
            for (const v of u.versions) {
              if (!/^\d+\.\d+\.\d+$/.test(v.version)) throw new Error(`bad version ${v.version}`);
              if (typeof v.update_link !== "string" || !v.update_link.includes("/releases/download/v")) {
                throw new Error(`bad update_link for ${v.version}`);
              }
              if (v.update_hash !== undefined && !v.update_hash.startsWith("sha256:")) {
                throw new Error(`bad update_hash for ${v.version}`);
              }
            }
            console.log(`update manifest OK (${u.versions.length} entries, newest ${u.versions[0].version})`);
          '

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_TAG: ${{ needs.sign.outputs.tag }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          WORK="$RUNNER_TEMP/pages"

          # Credentials travel through a credential helper rather than the
          # remote URL so the token can never leak into argv or git errors.
          export GIT_ASKPASS=/bin/true
          git config --global credential.helper '!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f'

          # Bootstrap the orphan branch on first deploy; afterwards every push
          # is a plain fast-forward — this branch is never force-pushed.
          if git ls-remote --exit-code --heads "https://github.com/$REPO.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://github.com/$REPO.git" "$WORK"
          else
            mkdir -p "$WORK"
            git -C "$WORK" init --initial-branch=gh-pages
            git -C "$WORK" remote add origin "https://github.com/$REPO.git"
          fi

          cp "$RUNNER_TEMP/updates.json" "$WORK/updates.json"
          touch "$WORK/.nojekyll"
          git -C "$WORK" add updates.json .nojekyll

          if git -C "$WORK" diff --cached --quiet; then
            echo "updates.json unchanged - nothing to publish"
            exit 0
          fi
          git -C "$WORK" -c user.name="mheci" \
            -c user.email="274998646+mheci@users.noreply.github.com" \
            commit -m "updates: publish manifest for ${NEEDS_TAG}"
          git -C "$WORK" push origin gh-pages
