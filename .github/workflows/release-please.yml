name: Release preparation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The default GITHUB_TOKEN suffices because the repository allows
          # Actions to create and approve pull requests (owner setting);
          # the previous dedicated PAT expired and broke every release run.
          token: ${{ github.token }}
