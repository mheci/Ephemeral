name: Release preparation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GITHUB_TOKEN cannot create PRs in this repo (Actions PR
          # creation is disabled); use a dedicated PAT secret instead.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
