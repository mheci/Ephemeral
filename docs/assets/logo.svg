<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Ephemeral</title>
  <desc id="desc">
    A flame rising from an open tray beside the Ephemeral wordmark: disposable
    containers that burn away their contents.
  </desc>
  <defs>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1c9aa8" />
      <stop offset="1" stop-color="#0b5f6a" />
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff9d3d" />
      <stop offset="1" stop-color="#e85d14" />
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffc15e" />
      <stop offset="1" stop-color="#ff8f2e" />
    </linearGradient>
  </defs>
  <g transform="translate(18 14)">
    <rect x="28" y="84" width="72" height="37" rx="13" fill="url(#tray)" />
    <ellipse cx="64" cy="83" rx="34" ry="7" fill="#0a525b" />
    <rect x="30" y="83" width="68" height="5" rx="2.5" fill="#35b9c4" />
    <path
      fill="url(#flame)"
      d="M64 16C59 36 46 48 39 62 33 76 36 90 48 96 56 100 72 100 80 96 92 90 95 76 89 62 82 48 69 36 64 16Z"
    />
    <path
      fill="url(#mid)"
      d="M64 38C60 54 51 62 46 72 43 80 47 88 55 91 61 94 67 94 73 91 81 88 85 80 82 72 77 62 68 54 64 38Z"
    />
    <ellipse cx="64" cy="72" rx="6.5" ry="9" fill="#fff6df" />
    <circle cx="90" cy="40" r="2.5" fill="#ffb23e" />
    <circle cx="38" cy="58" r="2" fill="#ffb23e" />
    <circle cx="74" cy="26" r="1.6" fill="#ffb23e" />
  </g>
  <text
    x="195"
    y="116"
    fill="#17232a"
    font-family="Inter,system-ui,sans-serif"
    font-size="78"
    font-weight="700"
    letter-spacing="-2"
  >
    Ephemeral
  </text>
</svg>
